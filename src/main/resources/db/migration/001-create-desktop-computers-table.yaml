databaseChangeLog:
  - changeSet:
      id: 001-create-desktop-computers-table
      author: igor
      changes:
        - createTable:
            tableName: desktop_computers
            columns:
              - column:
                    name: name
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: serial_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: manufacturer
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: form_factor
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

